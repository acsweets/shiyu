name: Engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
        working-directory: core
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib/app lib/features lib/main.dart lib/main_probe.dart test integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build windows --release
      - run: cargo fmt --all -- --check
        working-directory: core
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: core
      - run: cargo test --workspace --locked
        working-directory: core
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: sdkmanager "platforms;android-36" "ndk;28.2.13676358"
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --debug --target-platform android-x64
      - run: python3 ../scripts/verify_android_package.py build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: shiyu-m0-android-x64-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
