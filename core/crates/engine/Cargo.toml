[package]
name = "shiyu_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
jiff = { version = "=0.2.39", default-features = false, features = ["std", "tz-fat", "tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1"

[[bench]]
name = "compute_snapshot"
harness = false
