name: shiyu
description: "时余：本地优先的时间与薪资感知工具。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.12.0
  hotkey_manager: 0.2.3
  intl: ^0.20.3
  shiyu_bridge:
    path: rust_builder
  tray_manager: 0.5.2
  window_manager: 0.5.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/diagnostics/icon.ico
    - assets/diagnostics/icon.png
